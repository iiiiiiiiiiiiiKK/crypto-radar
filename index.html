    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // GitHub Pages has no SPA fallback: unknown paths land on 404.html which
      // stores the requested path and bounces back here.
      (function () {
        try {
          var stored = sessionStorage.getItem("crypto-radar:redirect");
          if (stored) {
            sessionStorage.removeItem("crypto-radar:redirect");
            var target = new URL(stored, window.location.origin);
            var prefix = window.location.pathname.replace(/[^/]*$/, "");
            if (target.pathname.indexOf(prefix) === 0) {
              window.history.replaceState({}, "", target.pathname + target.search + target.hash);
            }
          }
        } catch (error) {
          /* storage unavailable — the router falls back to the default route */
        }
      })();
    </script>
